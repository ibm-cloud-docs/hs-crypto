document_outline: 'Information about the IBM Hyper Protect Crypto Services on IBM Cloud.

  '
domain: IBM Hyper Protect Crypto Services on IBM Cloud
seed_examples:
- context: '## Why {{site.data.keyword.cloud_notm}} {{site.data.keyword.hscrypto}}?

    {: #why_hpcs}


    Data and information security are crucial and essential for IT environments. As more data moves to the cloud, keeping data protected becomes a nontrivial challenge. Built on IBM LinuxONE technology, {{site.data.keyword.hscrypto}} helps ensure that only you have access to your keys and data. A single-tenant key management service that is provided by dedicated customer-controlled HSMs helps you easily create and manage your encryption keys. Alternatively, you can bring your own encryption keys to the cloud. The service uses the same key-provider API as {{site.data.keyword.keymanagementserviceshort}}, a multi-tenant key management service, to provide a consistent approach to adopting {{site.data.keyword.cloud_notm}} services.


    {{site.data.keyword.hscrypto}} is a dedicated HSM that is controlled by you. {{site.data.keyword.cloud_notm}} administrators have no access. The service is built on FIPS 140-2 Level 4-certified hardware, the highest offered by any cloud provider in the industry. IBM is the first to provide a cloud command-line interface (CLI) for HSM [master key](#x2908413){: term} initialization to help enable you to take ownership of the cloud HSM. You can also load the master key with the {{site.data.keyword.IBM_notm}} {{site.data.keyword.hscrypto}} Management Utilities. The Management Utilities create and store your master key parts on smart cards and never exposes your secrets to the workstation and cloud, thus ensuring the highest level of protection to your secrets.


    {{site.data.keyword.hscrypto}} can integrate with {{site.data.keyword.cloud_notm}} data and storage services as well as VMware&reg; vSphere&reg; and VSAN, for providing data-at-rest encryption.

    The managed cloud HSM supports the industry-standard cryptographic operations by using the Public-Key Cryptography Standards (PKCS) #11. You don''t need to change your existing applications that use PKCS #11 standard to make it run in the {{site.data.keyword.hscrypto}} environment. The PKCS #11 library accepts the PKCS #11 API requests from your applications and remotely accesses the cloud HSM to execute the corresponding cryptographic functions, such as digital signing and validation.


    Enterprise PKCS #11 over gRPC (GREP11) is also supported by {{site.data.keyword.hscrypto}}. The EP11 library provides an interface similar to the industry-standard [PKCS #11 application programming interface (API)](http://docs.oasis-open.org/pkcs11/pkcs11-base/v2.40/os/pkcs11-base-v2.40-os.html){: external}.

    With the built-in encryption of {{site.data.keyword.hscrypto}}, you can easily build cloud applications with sensitive data. {{site.data.keyword.hscrypto}} provides you with complete control of your data and encryption keys, including the master key. The service also helps your business meet regulatory compliance with the technology that provides exclusive controls on the external and privileged user access to data and keys.

    '
  questions_and_answers:
  - question: What makes Hyper Protect Crypto Services (HPCS) unique for data security in the IBM Cloud?
    answer: HPCS is unique because it's a single-tenant key management service that is built on IBM LinuxONE technology and dedicated customer-controlled Hardware Security Modules (HSMs). This setup ensures that only the customer has access to their keys and data, providing a high level of security. It's also FIPS 140-2 Level 4 certified, the highest offered by any cloud provider, and allows customers to bring their own encryption keys to the cloud.
  - question: Can I use my existing PKCS 11-based applications with IBM Hyper Protect Crypto Services?
    answer: Yes, HPCS supports the industry-standard PKCS 11 API, allowing your existing applications to run without modification. It also supports Enterprise PKCS 11 over gRPC (GREP11) for enhanced integration.
  - question: How does IBM HPCS help with regulatory compliance and data protection?
    answer: HPCS gives you full control over your encryption keys, including the master key, and ensures that secrets are never exposed to workstations or the cloud. This exclusive control over external and privileged access helps meet stringent regulatory requirements.
- context: "## Creating standard keys with the UI\n{: #standard-key-gui}\n{: ui}\n\n[After you create an instance of the service](/docs/hs-crypto?topic=hs-crypto-provision), complete the following steps to create a standard key with the UI.\n\nIf you enable [dual authorization settings for your {{site.data.keyword.hscrypto}} instance](/docs/hs-crypto?topic=hs-crypto-manage-dual-auth), keep in mind that any keys that you add to the service require an authorization from two users to delete keys.\n{: note}\n\n1. [Log in to the UI](https://cloud.ibm.com/login){: external}.\n2. Go to **Menu** &gt; **Resource list** to view a list of your resources.\n3. From your {{site.data.keyword.cloud_notm}} resource list, select your provisioned instance of {{site.data.keyword.hscrypto}}.\n4. To create a new key, select the **KMS keys** tab in the side menu.\n5. In the **Keys** table, click **Add key**, and select **Create a key**.\n\n    Specify the key's details:\n\n    | Setting | Description |\n    |\
    \ --- | --- |\n    | Key type | The type of key that you would like to manage in {{site.data.keyword.hscrypto}}. From the list of key types, select **[Standard key](/docs/hs-crypto?topic=hs-crypto-understand-concepts#standard-key-concept)**. |\n    | Key name | A unique, human-readable alias for easy identification of your key. To protect your privacy, ensure that the key name does not contain personally identifiable information (PII), such as your name or location. |\n    | Key alias | (Optional) One or more unique, human-readable aliases that you want to assign to your key for easy recognition. Alias size can be 2 - 90 characters. You can set up to five key aliases for the key, with each separated by a comma. \\n \\n Note: Each alias must be alphanumeric, case-sensitive, and cannot contain spaces or special characters other than dashes (-) or underscores (_). The alias cannot be a version 4 UUID and must not be a {{site.data.keyword.hscrypto}} reserved name: `allowed_ip`, `key`, `keys`,\
    \ `metadata`, `policy`, `policies`, `registration`, `registrations`, `ring`, `rings`, `rotate`, `wrap`, `unwrap`, `rewrap`, `version`, `versions`. |\n    | Key ring ID | Select a key ring from the list that contains the existing key rings. If you don't assign a key ring, the key is added to the `default` key ring. For more information about key rings, see [Managing key rings](/docs/hs-crypto?topic=hs-crypto-managing-key-rings). |\n    | Expiration date | (Optional) Set the date and time when the key gets expired. After the expiration date, the key moves into the Deactivated state. For more information about key state, see [Monitoring the lifecycle of encryption keys](/docs/hs-crypto?topic=hs-crypto-key-states). |\n    | Description | (Optional) Add an extended description for your key. It needs to be 2 to 240 characters in length. |\n    {: caption=\"Describes the settings to create a key\" caption-side=\"bottom\"}\n\n5. When you finish filling out the key's details, click **Create key**\
    \ to confirm.\n"
  questions_and_answers:
  - question: How do I create a standard key by using the IBM Hyper Protect Crypto Services UI?
    answer: After provisioning your HPCS instance, log in to the IBM Cloud UI, navigate to Menu > Resource list, select your HPCS instance, go to the KMS keys tab, and click Add key > Create a key. Then, fill in the key details and click Create key to finalize.
  - question: What are the naming criteria for keys in HPCS?
    answer: "Key names should be unique and avoid personally identifiable information. You can assign up to five aliases (2\u201390 characters each), using only alphanumeric characters, dashes, or underscores. Reserved names and version 4 UUIDs are not allowed."
  - question: What happens if dual authorization is enabled for my HPCS instance?
    answer: If dual authorization is enabled, any key you add will require approval from two users to be deleted, enhancing security and control over key management.
- context: "## Creating root keys with the UI\n   {: #root-key-gui}\n   {: ui}\n\n  [After you create an instance of the service](/docs/hs-crypto?topic=hs-crypto-provision), complete the following steps to create a root key with the UI.\n\n  If you enable [dual authorization settings for your {{site.data.keyword.hscrypto}} instance](/docs/hs-crypto?topic=hs-crypto-manage-dual-auth), keep in mind that any keys that you add to the service require an authorization from two users to delete keys.\n  {: note}\n\n  1. [Log in to the UI](https://cloud.ibm.com/login){: external}.\n  2. Go to **Menu** &gt; **Resource list** to view a list of your resources.\n  3. From your {{site.data.keyword.cloud_notm}} resource list, select your provisioned instance of {{site.data.keyword.hscrypto}}.\n  4. To create a new key, select the **KMS keys** tab in the side menu.\n  5. In the **Keys** table, click **Add key**, and select **Create a key**.\n\n      Specify the key's details:\n\n      | Setting | Description\
    \ |\n      | --- | --- |\n      | Key type | The type of key that you would like to manage in {{site.data.keyword.hscrypto}}. From the list of key types, select **[Root key](/docs/hs-crypto?topic=hs-crypto-understand-concepts#root-key-concept)**. |\n      | Key name | A unique, human-readable name for easy identification of your key. Length must be within 2 - 90 characters. To protect your privacy, ensure that the key name does not contain personally identifiable information (PII), such as your name or location. |\n      | Key alias | (Optional) One or more unique, human-readable aliases that you want to assign to your key for easy recognition. Alias size can be 2 - 90 characters. You can set up to five key aliases for the key, with each separated by a comma. \\n \\n Note: Each alias must be alphanumeric, case-sensitive, and cannot contain spaces or special characters other than dashes (-) or underscores (_). The alias cannot be a version 4 UUID and must not be a {{site.data.keyword.hscrypto}}\
    \ reserved name: `allowed_ip`, `key`, `keys`, `metadata`, `policy`, `policies`, `registration`, `registrations`, `ring`, `rings`, `rotate`, `wrap`, `unwrap`, `rewrap`, `version`, `versions`. |\n      | Key ring ID | Select a key ring from the list that contains the existing key rings. If you don't assign a key ring, the key is added to the `default` key ring. For more information about key rings, see [Managing key rings](/docs/hs-crypto?topic=hs-crypto-managing-key-rings). |\n      | Expiration date | **Optional**. The date and time that the key expires in the system, in RFC 3339 format (YYYY-MM-DD HH:MM:SS.SS, for example 2019-10-12T07:20:50.52Z). Use caution when setting an expiration date, as keys created with an expiration date automatically transition to the Deactivated state within one hour after expiration. In this state, the only allowed actions on the key are unwrap, rewrap, rotate, and delete. Deactivated keys cannot be used to encrypt (wrap) new data, even if rotated while\
    \ deactivated. Rotation does not reset or extend the expiration date, nor does it allow the date to be changed. It is recommended that any data encrypted with an expiring or expired key be re-encrypted using a new customer root key (CRK) before the original CRK expires, to prevent service disruptions. Deleting and restoring a deactivated key does not move it back to the Active state. If the expiration_date attribute is omitted, the key does not expire. |\n      | Description | (Optional) Add an extended description for your key. It can be two to 240 characters in length. |\n      {: caption=\"Describes the settings to create a key\" caption-side=\"bottom\"}\n\n  6. When you finish filling out the key's details, click **Create key** to confirm.\n\n  Keys that are created in the service are symmetric 256-bit keys, supported by the AES-CBC algorithm. For added security, keys are generated by FIPS 140-2 Level 4 certified [hardware security modules (HSMs)](#x6704988){: term} that are located\
    \ in secure {{site.data.keyword.cloud_notm}} data centers.\n"
  questions_and_answers:
  - question: How do I create a root key in IBM Hyper Protect Crypto Services using the UI?
    answer: After provisioning your HPCS instance, log in to the IBM Cloud UI, navigate to Menu > Resource list, select your instance, go to the KMS keys tab, click Add key > Create a key, choose Root key as the key type, fill in the required details, and click Create key to complete the process.
  - question: What precautions should I take when setting an expiration date for a root key?
    answer: Use caution when setting an expiration date, as the key automatically transitions to the Deactivated state within one hour after expiration. Deactivated keys cannot encrypt new data and cannot be restored to Active state. It's recommended to re-encrypt data with a new root key before the original expires.
  - question: What security features support root key creation in HPCS?
    answer: Root keys are symmetric 256-bit AES-CBC keys generated by FIPS 140-2 Level 4 certified hardware security modules (HSMs) located in secure IBM Cloud data centers, ensuring high levels of cryptographic security.
- context: "# Service architecture - Standard Plan\n{: #architecture-workload-isolation}\n\nReview the service architecture, workload isolation characteristics, and service dependencies for {{site.data.keyword.cloud}} {{site.data.keyword.hscrypto}}.\n{: shortdesc}\n\n## {{site.data.keyword.hscrypto}} architecture\n{: #architecture}\n\nThe following architecture diagram shows how you interact with {{site.data.keyword.hscrypto}} components to protect your sensitive data and keys.\n\n![Service instance components](/images/hs-crypto-components-new.svg \"Service instance components\"){: caption=\"Interaction with {{site.data.keyword.hscrypto}} components\" caption-side=\"bottom\"}\n\nThe following list explains each component in detail.\n\nKey management service API\n:   The API that you use to interact with the key management service (KMS) module to manage root keys and standard keys.\n\nPKCS #11 API\n:   The industry standard API to perform cryptographic operations. {{site.data.keyword.hscrypto}}\
    \ implements API functions with the PKCS #11 library that interacts with the Enterprise PKCS #11 (EP11) module in the cloud HSM.\n\nGREP11 API\n:   The abbreviation of Enterprise PKCS #11 over gRPC API. It is a stateless interface for cryptographic operations, which also leverages the EP11 module in the cloud HSM.\n\nManagement Utilities\n:   The Management Utilities are composed of the Smart Card Utility Program and the Trusted Key Entry (TKE) application, which provide GUI for you to initialize service instances. With signature keys and master key parts that are stored on smart cards, the Management Utilities provide an approach to initializing service instances with the highest level of security.\n\nTKE CLI plug-in\n:   A CLI plug-in working with {{site.data.keyword.cloud_notm}} CLI for you to initialize service instances. Depending on whether recovery crypto units are assigned to your instance, the plug-in provides two ways for instance initialization: by using recovery crypto units\
    \ and by using key part files.\n\nOperational crypto unit\n:   Each service instance is composed of multiple operational crypto units. The operational crypto units are located in different availability zones of the same region for high availability. They are used to manage encryption keys and perform cryptographic operations. The number of crypto units that you specify when you create your instance is the number of operational crypto units.\n\nRecovery crypto unit\n:   The purpose of recovery crypto units is to generate a random master key value and to save a backup copy of the master key value. You can use recovery crypto units to load the master key and restore the master key when it is destroyed or lost.\n\n    Currently, service instances in the Madrid (`eu-es`) region don't support recovery crypto units. If you create your instance in regions other than `eu-es`, two recovery crypto units are automatically assigned to your instance without extra costs.\n\n    If smart cards are used\
    \ to load the master key, the recovery crypto units are not applicable and can be ignored. The backup of the master key relies on the backup of the smart cards in that case.\n    {: note}\n\nFailover crypto unit\n:   Failover crypto units back up the operational crypto units in another region, which includes keystores that store encryption keys. When a regional disaster occurs, you can use failover crypto units to ensure production workloads and avoid data loss.\n\n    Currently, failover crypto units are available only in the regions of Dallas (`us-south`), Washington DC (`us-east`), and Madrid (`eu-es`). If you create your instance in any of the three regions, you can choose whether to enable the failover crypto units with [extra charges](/docs/hs-crypto?topic=hs-crypto-faq-pricing).\n    {: note}\n\nFor more information about the {{site.data.keyword.hscrypto}} components, see [Components and concepts](/docs/hs-crypto?topic=hs-crypto-understand-concepts).\n\n## {{site.data.keyword.hscrypto}}\
    \ workload isolation\n{: #workload-isolation}\n\n{{site.data.keyword.hscrypto}} is a single-tenant, regional service that supports complete tenant-based workload isolation with the following characteristics:\n\n- Dedicated keystore in {{site.data.keyword.hscrypto}} is provided to ensure data isolation and security.\n- You have exclusive control to your hardware security module (HSM) and your master key. Privileged users are locked out for protection against abusive use of system administrator credentials or root user credentials.\n- [Secure Service Container (SSC)](https://www.ibm.com/marketplace/secure-service-container){: external} provides the enterprise level of security and impregnability that enterprise customers expect from [IBM LinuxONE](https://www.ibm.com/it-infrastructure/linuxone){: external} technology.\n\nThe following diagram illustrates how {{site.data.keyword.hscrypto}} workload of each tenant is isolated.\n\n![{{site.data.keyword.hscrypto}} workload isolation](/images/architecture-workload-isolation.svg\
    \ \"{{site.data.keyword.hscrypto}} workload isolation\"){: caption=\"{{site.data.keyword.hscrypto}} workload isolation\" caption-side=\"bottom\"}\n"
  questions_and_answers:
  - question: What APIs are available in HPCS for cryptographic operations and key management?
    answer: HPCS provides three main APIs:Key Management Service API for managing root and standard keys. PKCS 11 API, an industry-standard interface for cryptographic operations using the EP11 module. GREP11 API, a stateless gRPC-based interface that also interacts with the EP11 module.
  - question: How does HPCS ensure workload isolation for each tenant?
    answer: HPCS ensures tenant-based workload isolation through a dedicated keystore for each tenant. Exclusive control over the HSM and master key, preventing access by privileged users. Use of Secure Service Container (SSC) technology for enterprise-grade security on IBM LinuxONE.
  - question: What are recovery and failover crypto units, and where are they supported?
    answer: Recovery crypto units help generate and back up master keys. They are not supported in the Madrid (eu-es) region. Failover crypto units provide backup in another region to prevent data loss during disasters. They are available in Dallas (us-south), Washington DC (us-east), and Madrid (eu-es), with optional enablement and extra charges.
- context: '# Initializing service instances using recovery crypto units

    {: #initialize-hsm-recovery-crypto-unit}


    Before you can use your {{site.data.keyword.hscrypto}} instance, you need to first initialize your service instance by loading the master key. This topic guides you through the steps to initialize your service instance by using recovery crypto units through {{site.data.keyword.cloud_notm}} TKE CLI plug-in.

    {: shortdesc}


    For an introduction to the approaches of service instance initialization and the related fundamental concepts, see [Initializing service instances](/docs/hs-crypto?topic=hs-crypto-introduce-service) and [Introducing service instance initialization approaches](/docs/hs-crypto?topic=hs-crypto-initialize-instance-mode).


    Currently, service instances in the `eu-es` region don''t support recovery crypto units. When a service instance is provisioned in other supported regions, you are by default enabled with the option to back up your master keys in the recovery crypto units located in the disaster recovery region. For more information about supported regions, see [Regions and locations](/docs/hs-crypto?topic=hs-crypto-regions).


    If smart cards are used to initialize the service instance, the recovery crypto units are not applicable and can be ignored. The backup of the master key relies on the backup of the smart cards in that case.


    You can automate the instance initialization with recovery crypto units by using Terraform. For more information, see [Setting up Terraform for {{site.data.keyword.hscrypto}}](/docs/hs-crypto?topic=hs-crypto-terraform-setup-for-hpcs).


    It is your responsibility to secure assets used to initialize the {{site.data.keyword.hscrypto}} instance. For best practices, see [the FAQ](/docs/hs-crypto?topic=hs-crypto-faq-support-maintenance#faq-manage-smartcards).

    {: note}

    '
  questions_and_answers:
  - question: How do I initialize a HPCS service instance using recovery crypto units?
    answer: You can initialize your service instance by loading the master key using the TKE CLI plug-in provided by IBM Cloud. This method utilizes recovery crypto units located in a disaster recovery region to back up your master keys.
  - question: Are recovery crypto units available in all regions?
    answer: No, recovery crypto units are not supported in the eu-es (Madrid) region. In other supported regions, recovery crypto units are automatically enabled for backing up master keys at no extra cost.
  - question: Can I use smart cards instead of recovery crypto units for initialization?
    answer: Yes, if you use smart cards to initialize your service instance, recovery crypto units are not applicable. In this case, the master key backup relies on the smart cards themselves.
